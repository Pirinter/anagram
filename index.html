        async function fetchWithRetry(fn, retries = 5, delay = 1000) {
            try { return await fn(); } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(r => setTimeout(r, delay));
                return fetchWithRetry(fn, retries - 1, delay * 2);
            }

 * This draws the score directly onto the game canvas.
 */
function drawHUD(ctx, canvasWidth) {
  // Set text styles
  ctx.fillStyle = 'white';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  // Draw current score (Top Left)
  ctx.fillText(`SCORE: ${score}`, 20, 20);

  // Draw high score (Top Right)
  ctx.textAlign = 'right';
  ctx.fillText(`BEST: ${highScore}`, canvasWidth - 20, 20);
  
  // Add a subtle shadow for better readability over bright backgrounds
  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
  ctx.shadowBlur = 4;
}

/**
 * UTILITY: Collision Helper
 */
function isColliding(a, b) {
  return a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

     }

      // LOGIC ADDED: Update High Score if needed
              if (score > highScore) {
                highScore = score;
              }

      // Remove the target so it's only counted once
              targets.splice(i, 1);
      
      // Trigger a visual feedback (optional)
                createScorePopup(target.x, target.y, target.type === 'gold' ? 50 : 10);
            }
          }
        }

        
        
        function startTimer() {
            stopTimer();
            gameStartTime = Date.now();
            timerInterval = setInterval(() => {
                totalElapsedSeconds = Math.floor((Date.now() - gameStartTime) / 1000);
                document.getElementById('timer-display').innerText = formatTime(totalElapsedSeconds);
            }, 1000);
        }

        function stopTimer() { if (timerInterval) clearInterval(timerInterval); }

        function loadAnagramWord() {
            const item = activeGame.wordList[anagramIndex];
            document.getElementById('anagram-clue').innerText = item.clue;
            document.getElementById('game-progress').innerText = `${anagramIndex + 1}/${activeGame.wordList.length}`;
            
            const slots = document.getElementById('anagram-answer-slots');
            slots.innerHTML = item.word.split('').map(() => `<div class="w-12 h-14 md:w-16 md:h-20 rounded-xl border-4 border-dashed border-slate-200 flex items-center justify-center text-2xl md:text-4xl font-black transition-all"></div>`).join('');
            
            const tiles = document.getElementById('anagram-tiles');
            let letters = item.word.split('').sort(() => Math.random() - 0.5);
            tiles.innerHTML = letters.map(char => `
                <button data-char="${char}" onclick="handleTileClick(this, '${char}')" 
                    class="tile-btn w-12 h-14 md:w-16 md:h-20 bg-white rounded-xl shadow-lg text-2xl md:text-3xl font-black border-b-4 border-slate-200 active:translate-y-1 active:border-b-0 transition-all hover:bg-indigo-50 hover:text-indigo-600">
                    ${char}
                </button>
            `).join('');
            currentWordAnswer = [];
        }

        window.handleTileClick = (btn, char) => {
            const correctWord = activeGame.wordList[anagramIndex].word;
            const expectedChar = correctWord[currentWordAnswer.length];

            if (char === expectedChar) {
                const slots = document.getElementById('anagram-answer-slots').children;
                const slot = slots[currentWordAnswer.length];
                slot.innerText = char;
                slot.classList.replace('border-slate-200', 'bg-indigo-600');
                slot.classList.add('text-white', 'border-indigo-700');
                currentWordAnswer.push(char);
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';
                btn.classList.add('used-tile');

                if (currentWordAnswer.length === correctWord.length) {
                    setTimeout(() => {
                        anagramIndex++;
                        if (anagramIndex < activeGame.wordList.length) loadAnagramWord();
                        else finishGame();
                    }, 500);
                }
            } else {
                btn.classList.add('animate-shake', 'text-red-500');
                setTimeout(() => btn.classList.remove('animate-shake', 'text-red-500'), 300);
            }
        };

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (currentView !== 'anagram' || !activeGame) return;
            if (document.activeElement.tagName === 'INPUT') return;
            const char = e.key.toUpperCase();
            if (char.length === 1 && char >= 'A' && char <= 'Z') {
                const availableButtons = Array.from(document.querySelectorAll('.tile-btn:not(.used-tile)'));
                const match = availableButtons.find(btn => btn.dataset.char === char);
                if (match) handleTileClick(match, char);
            }
        });

        function finishGame() {
            stopTimer();
            const finalTime = formatTime(totalElapsedSeconds);
            showModal("Well Done!", `
                <div class="text-center space-y-4">
                    <p class="text-slate-500">You completed the challenge in <span class="font-black text-indigo-600 text-2xl">${finalTime}</span></p>
                    <div class="space-y-2 text-left mt-6">
                        <label class="text-[10px] font-black uppercase text-slate-400">Enter your name for the leaderboard</label>
                        <input id="player-name" class="w-full bg-slate-50 p-4 rounded-xl border-2 border-slate-100 outline-none focus:border-indigo-500 font-bold" maxlength="20" placeholder="e.g. Brainiac">
                    </div>
                    <button id="submit-score-btn" onclick="submitToLeaderboard()" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-bold mt-4 shadow-lg active:scale-95 transition-all">Submit Score</button>
                </div>
            `, false);
        }

        window.submitToLeaderboard = async () => {
            const name = document.getElementById('player-name').value.trim() || "Anonymous";
            const lbRef = collection(db, 'artifacts', appId, 'public', 'data', `leaderboard_${activeGameId}`);
            await fetchWithRetry(() => addDoc(lbRef, { name, timeSeconds: totalElapsedSeconds, timestamp: Date.now() }));
            closeModal();
            viewLeaderboard(activeGameId);
        };

        window.viewLeaderboard = async (gameId) => {
            const game = allGames.find(g => g.id === gameId);
            if (!game) return;
            showView('leaderboard');
            document.getElementById('lb-game-title').innerText = game.title;
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = `<div class="text-center py-10 animate-pulse text-slate-400">Fetching scores...</div>`;
            const lbRef = collection(db, 'artifacts', appId, 'public', 'data', `leaderboard_${gameId}`);
            onSnapshot(lbRef, (snap) => {
                const scores = snap.docs.map(d => d.data()).sort((a, b) => a.timeSeconds - b.timeSeconds).slice(0, 10);
                if (scores.length === 0) { list.innerHTML = `<p class="text-center py-10 text-slate-400">No records found. Be the first to play!</p>`; return; }
                list.innerHTML = scores.map((s, i) => `
                    <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl">
                        <span class="font-bold text-slate-700">${i + 1}. ${escapeHtml(s.name)}</span>
                        <span class="font-black text-indigo-600">${formatTime(s.timeSeconds)}</span>
                    </div>
                `).join('');
            });
        };

        window.confirmExit = () => { stopTimer(); showModal("Exit Game?", "Are you sure you want to quit? Your progress will not be saved.", true, () => showView('library')); };

        // Modal System
        window.showModal = (title, content, showClose = true, confirmAction = null) => {
            const container = document.getElementById('modal-container');
            const box = document.getElementById('modal-content');
            box.innerHTML = `
                <h3 class="text-2xl font-black mb-4">${title}</h3>
                <div class="text-slate-600">${content}</div>
                <div class="flex gap-2 mt-6">
                    ${confirmAction ? `<button id="modal-confirm" class="flex-1 bg-indigo-600 text-white p-4 rounded-xl font-bold">Confirm</button>` : ''}
                    ${showClose ? `<button id="modal-cancel-btn" class="flex-1 bg-slate-100 p-4 rounded-xl font-bold">${confirmAction ? 'Cancel' : 'Close'}</button>` : ''}
                </div>
            `;
            if (confirmAction) {
                document.getElementById('modal-confirm').onclick = () => {
                    confirmAction();
                    if (!document.getElementById('admin-pass-input')) closeModal();
                };
            }
            if (showClose) {
                document.getElementById('modal-cancel-btn').onclick = () => { 
                    closeModal(); 
                    if(currentView==='anagram') startTimer(); 
                };
            }
            
            container.classList.remove('hidden'); 
            container.classList.add('flex');
        };

        window.closeModal = () => { 
            const container = document.getElementById('modal-container');
            container.classList.add('hidden'); 
            container.classList.remove('flex'); 
        };

        initAuth();
    </script>
</body>
</html>
