<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGame Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.2s ease-in-out; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen transition-colors duration-300">

    <!-- 1. LIBRARY VIEW -->
    <div id="view-library" class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
        <header class="flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl md:text-5xl font-black text-indigo-600 tracking-tight">EduLibrary</h1>
                <p class="text-slate-500 font-medium">Create and share interactive educational games</p>
            </div>
            <button onclick="showView('setup')" class="w-full md:w-auto bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                Create New Game
            </button>
        </header>

        <div class="relative group">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <input id="search-input" oninput="filterGames()" class="w-full bg-white border-2 border-slate-100 p-5 pl-12 rounded-3xl outline-none focus:border-indigo-500 shadow-sm transition-all" placeholder="Search by title...">
        </div>

        <div id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full py-20 text-center text-slate-400 animate-pulse">
                Initializing library...
            </div>
        </div>
    </div>

    <!-- 2. SETUP VIEW -->
    <div id="view-setup" class="max-w-2xl mx-auto p-4 md:p-8 space-y-6 hidden">
        <button onclick="showView('library')" class="text-slate-500 font-bold flex items-center gap-2 hover:text-indigo-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to Library
        </button>
        
        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border border-slate-100 space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">Game Designer</h2>
            
            <div class="space-y-2">
                <label class="text-sm font-bold text-slate-500 uppercase tracking-wider">Game Title</label>
                <input id="setup-title" class="w-full text-xl font-bold border-b-2 border-slate-100 outline-none p-2 focus:border-indigo-500 transition-colors" placeholder="e.g. Periodic Table Quiz">
            </div>
            
            <div class="space-y-4">
                <label class="text-sm font-bold text-slate-500 uppercase tracking-wider">Words & Clues</label>
                <div id="word-entry-list" class="space-y-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar"></div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl">
                    <input id="new-word" placeholder="The Word" class="p-3 border-2 border-white rounded-xl outline-none focus:border-indigo-300">
                    <input id="new-clue" placeholder="The Clue/Hint" class="p-3 border-2 border-white rounded-xl outline-none focus:border-indigo-300">
                    <button onclick="addWordToSetup()" class="md:col-span-2 bg-indigo-100 text-indigo-700 p-3 rounded-xl font-bold hover:bg-indigo-200 transition-all">
                        + Add to List
                    </button>
                </div>
            </div>

            <button id="publish-btn" onclick="publishGame()" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                <span id="publish-text">Publish Game</span>
                <div id="publish-spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            </button>
        </div>
    </div>

    <!-- 3. ANAGRAM GAME VIEW -->
    <div id="view-anagram" class="hidden min-h-screen flex flex-col pt-24 p-4 md:p-8">
        <div class="fixed top-0 left-0 right-0 p-4 md:p-6 flex justify-between items-center glass-panel z-20 shadow-sm">
            <button onclick="confirmExit()" class="flex items-center gap-2 text-slate-500 font-bold hover:text-red-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                <span class="hidden sm:inline">Quit Game</span>
            </button>
            <div class="flex gap-4 md:gap-8 items-center text-lg md:text-xl font-black">
                <span id="game-progress" class="text-slate-400">Word 1/10</span>
                <span id="game-score" class="text-indigo-600 bg-indigo-50 px-4 py-1 rounded-full">0</span>
            </div>
        </div>

        <div class="max-w-4xl mx-auto w-full text-center space-y-12 my-auto">
            <div class="space-y-4">
                <p class="text-sm font-bold text-indigo-500 uppercase tracking-[0.2em]">The Clue</p>
                <h2 id="anagram-clue" class="text-2xl md:text-4xl font-bold text-slate-800 leading-tight"></h2>
            </div>
            
            <div id="anagram-answer-slots" class="flex flex-wrap justify-center gap-2 md:gap-3 min-h-[80px]"></div>
            
            <div class="space-y-4">
                <p class="text-xs font-bold text-slate-400 uppercase">Available Letters</p>
                <div id="anagram-tiles" class="bg-slate-100/50 p-6 md:p-10 rounded-[3rem] flex flex-wrap justify-center gap-3 md:gap-4 border-2 border-slate-200/50"></div>
            </div>
        </div>
    </div>

    <!-- Custom Modals -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl scale-95 transition-transform">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, getDoc, onSnapshot, query, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // --- Firebase Init ---
        const firebaseConfig = {
              apiKey: "AIzaSyAVhUXndWYToC8rTTB2euhLK3peqRdtOxU",
              authDomain: "my-edu-game-3a6ab.firebaseapp.com",
              projectId: "my-edu-game-3a6ab",
              storageBucket: "my-edu-game-3a6ab.firebasestorage.app",
              messagingSenderId: "954092350845",
              appId: "1:954092350845:web:b16cfce906a8349e8bf014",
              measurementId: "G-LDWC6QFKCE"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'anagram-game';

        // --- State Management ---
        let user = null;
        let allGames = [];
        let setupWords = [];
        let activeGame = null;
        let anagramIndex = 0;
        let score = 0;
        let currentWordAnswer = [];
        let currentView = 'library';

        // --- Exponential Backoff Fetch ---
        async function fetchWithRetry(fn, retries = 5, delay = 1000) {
            try {
                return await fn();
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(fn, retries - 1, delay * 2);
            }
        }

        // --- Navigation ---
        window.showView = (viewId) => {
            document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            currentView = viewId;
            window.scrollTo(0,0);
        };

        // --- Auth Setup ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error", error);
                showModal("Connection Error", "Could not connect to the server. Please check your internet connection.");
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                setupLibraryListener();
            }
        });

        // --- Library Logic ---
        function setupLibraryListener() {
            if (!user) return;
            const gamesRef = collection(db, 'artifacts', appId, 'public', 'data', 'games');
            
            onSnapshot(gamesRef, (snapshot) => {
                allGames = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderGameGrid(allGames);
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function renderGameGrid(games) {
            const grid = document.getElementById('game-grid');
            if (games.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">No games found. Create the first one!</div>`;
                return;
            }

            grid.innerHTML = games.map(game => `
                <div class="bg-white p-6 rounded-3xl border-2 border-slate-50 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all group">
                    <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-1">${escapeHtml(game.title)}</h3>
                    <p class="text-slate-400 text-sm mb-6 font-medium">${game.wordList.length} challenge words</p>
                    <button onclick="startAnagram('${game.id}')" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                        Play Anagrams
                    </button>
                </div>
            `).join('');
        }

        window.filterGames = () => {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allGames.filter(g => g.title.toLowerCase().includes(term));
            renderGameGrid(filtered);
        };

        // --- Setup Logic ---
        window.addWordToSetup = () => {
            const wordInput = document.getElementById('new-word');
            const clueInput = document.getElementById('new-clue');
            const w = wordInput.value.trim().toUpperCase();
            const c = clueInput.value.trim();
            
            if(!w || !c) return;
            setupWords.push({ word: w, clue: c });
            
            wordInput.value = '';
            clueInput.value = '';
            wordInput.focus();
            renderSetupWords();
        };

        function renderSetupWords() {
            const list = document.getElementById('word-entry-list');
            list.innerHTML = setupWords.map((item, i) => `
                <div class="flex justify-between items-center p-3 bg-indigo-50/50 border border-indigo-100 rounded-xl animate-in fade-in slide-in-from-right-4 duration-300">
                    <div class="flex flex-col">
                        <span class="font-black text-indigo-700">${escapeHtml(item.word)}</span>
                        <span class="text-sm text-slate-500">${escapeHtml(item.clue)}</span>
                    </div>
                    <button onclick="removeWord(${i})" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                    </button>
                </div>
            `).join('');
        }

        window.removeWord = (index) => {
            setupWords.splice(index, 1);
            renderSetupWords();
        };

        window.publishGame = async () => {
            const title = document.getElementById('setup-title').value.trim();
            if(!title) return showModal("Missing Title", "Your game needs a catchy name!");
            if(setupWords.length < 1) return showModal("Empty Wordlist", "Add at least one word to your game.");

            const btn = document.getElementById('publish-btn');
            const text = document.getElementById('publish-text');
            const spinner = document.getElementById('publish-spinner');

            try {
                btn.disabled = true;
                text.innerText = "Publishing...";
                spinner.classList.remove('hidden');

                await fetchWithRetry(() => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'games'), {
                    title: title,
                    wordList: setupWords,
                    author: user.uid,
                    createdAt: Date.now()
                }));

                setupWords = [];
                document.getElementById('setup-title').value = '';
                renderSetupWords();
                showView('library');
                showModal("Success!", "Your game is now live in the library.");
            } catch (error) {
                console.error("Publish failed", error);
                showModal("Publish Failed", "We couldn't save your game. Please try again.");
            } finally {
                btn.disabled = false;
                text.innerText = "Publish Game";
                spinner.classList.add('hidden');
            }
        };

        // --- Gameplay Logic ---
        window.startAnagram = async (gameId) => {
            try {
                const gameDoc = await fetchWithRetry(() => getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', gameId)));
                if (!gameDoc.exists()) return;
                
                activeGame = gameDoc.data();
                anagramIndex = 0;
                score = 0;
                loadAnagramWord();
                showView('anagram');
            } catch (error) {
                showModal("Error", "Could not load the game. Please try again.");
            }
        };

        function loadAnagramWord() {
            const item = activeGame.wordList[anagramIndex];
            document.getElementById('anagram-clue').innerText = item.clue;
            document.getElementById('game-score').innerText = score;
            document.getElementById('game-progress').innerText = `Word ${anagramIndex + 1}/${activeGame.wordList.length}`;
            
            const slots = document.getElementById('anagram-answer-slots');
            slots.innerHTML = item.word.split('').map(() => `
                <div class="w-12 h-14 md:w-16 md:h-20 rounded-xl md:rounded-2xl border-4 border-dashed border-slate-200 flex items-center justify-center text-2xl md:text-4xl font-black transition-all"></div>
            `).join('');
            
            const tiles = document.getElementById('anagram-tiles');
            // Shuffle letters but ensure it's not the actual word by chance
            let letters = item.word.split('');
            do {
                letters.sort(() => Math.random() - 0.5);
            } while (letters.join('') === item.word && letters.length > 1);

            tiles.innerHTML = letters.map((char, i) => `
                <button onclick="handleTileClick(this, '${char}')" 
                    class="w-12 h-14 md:w-16 md:h-20 bg-white rounded-xl md:rounded-2xl shadow-lg text-2xl md:text-3xl font-black border-b-4 border-slate-300 active:translate-y-1 active:border-b-0 transition-all hover:bg-indigo-50 hover:text-indigo-600">
                    ${char}
                </button>
            `).join('');
            
            currentWordAnswer = [];
        }

        window.handleTileClick = (btn, char) => {
            const correctWord = activeGame.wordList[anagramIndex].word;
            const expectedChar = correctWord[currentWordAnswer.length];

            if (char === expectedChar) {
                const slots = document.getElementById('anagram-answer-slots').children;
                const slot = slots[currentWordAnswer.length];
                
                slot.innerText = char;
                slot.classList.remove('border-dashed', 'border-slate-200');
                slot.classList.add('bg-indigo-600', 'text-white', 'border-indigo-700', 'scale-110');
                setTimeout(() => slot.classList.remove('scale-110'), 200);

                currentWordAnswer.push(char);
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';
                
                score += 10;
                document.getElementById('game-score').innerText = score;

                if (currentWordAnswer.length === correctWord.length) {
                    handleWordComplete();
                }
            } else {
                btn.classList.add('animate-shake', 'border-red-500', 'text-red-500');
                setTimeout(() => btn.classList.remove('animate-shake', 'border-red-500', 'text-red-500'), 500);
            }
        };

        function handleWordComplete() {
            setTimeout(() => {
                anagramIndex++;
                if(anagramIndex < activeGame.wordList.length) {
                    loadAnagramWord();
                } else {
                    showGameSummary();
                }
            }, 800);
        }

        function showGameSummary() {
            showModal("Course Complete!", `
                <div class="text-center space-y-4">
                    <div class="text-6xl mb-4">🏆</div>
                    <p class="text-slate-600 font-medium">You've mastered "${escapeHtml(activeGame.title)}"!</p>
                    <div class="bg-indigo-50 p-6 rounded-3xl">
                        <p class="text-sm uppercase font-bold text-indigo-400">Final Score</p>
                        <p class="text-5xl font-black text-indigo-600">${score}</p>
                    </div>
                    <button onclick="closeModal(); showView('library')" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold mt-4 shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">
                        Back to Library
                    </button>
                </div>
            `, false);
        }

        window.confirmExit = () => {
            showModal("Quit Game?", `
                <p class="text-slate-500 mb-6">Are you sure you want to quit? Your current progress will be lost.</p>
                <div class="flex gap-3">
                    <button onclick="closeModal()" class="flex-1 bg-slate-100 p-4 rounded-2xl font-bold">Keep Playing</button>
                    <button onclick="closeModal(); showView('library')" class="flex-1 bg-red-500 text-white p-4 rounded-2xl font-bold">Quit</button>
                </div>
            `);
        };

        // --- Utils ---
        function showModal(title, content, showClose = true) {
            const container = document.getElementById('modal-container');
            const contentBox = document.getElementById('modal-content');
            
            contentBox.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-2xl font-black text-slate-800">${title}</h3>
                    ${showClose ? `<button onclick="closeModal()" class="text-slate-300 hover:text-slate-500"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>` : ''}
                </div>
                <div class="text-slate-600">${content}</div>
            `;
            
            container.classList.remove('hidden');
            container.classList.add('flex');
            setTimeout(() => contentBox.classList.remove('scale-95'), 10);
        }

        window.closeModal = () => {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
            container.classList.remove('flex');
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize App
        initAuth();
    </script>
</body>
</html>
